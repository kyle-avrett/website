[project]
name = "website-api"
version = "1.0.0"
description = "An api for kyleavrett.com"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.139.0",
    "httpx2>=2.5.0",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "debugpy>=1.8.21",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.20",
    "ty>=0.0.56",
]

[tool.pytest.ini_options]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
]
pythonpath = ["."]
testpaths = ["tests"]
